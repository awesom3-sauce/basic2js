name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install

      - name: Typecheck (compiler core + CLI)
        run: npm run typecheck

      - name: Typecheck (web UI)
        run: npm run web:typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build (compiler core + CLI)
        run: npm run build

      - name: Build (web UI)
        run: npm run web:build
